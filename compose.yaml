name: adr-diagram

services:
  frontend:
    image: adr-diagram-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${HOST_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    image: adr-diagram-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Use a URL-safe (alphanumeric/hyphen/underscore) password in this mode.
      DATABASE_URL: "postgresql://adr_diagram:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}@db:5432/adr_diagram"
    init: true
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: adr_diagram
      POSTGRES_USER: adr_diagram
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Explicit psql access only: this is NOT /docker-entrypoint-initdb.d.
      - ./backend/drizzle:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
