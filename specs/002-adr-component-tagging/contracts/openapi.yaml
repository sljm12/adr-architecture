openapi: 3.0.3
info:
  title: ADR Diagram API - Architecture Decision Records
  version: 1.0.0
paths:
  /diagrams/{diagramId}/adrs:
    get:
      summary: List ADR summaries for a diagram
      parameters:
        - $ref: '#/components/parameters/DiagramId'
      responses:
        '200':
          description: ADR summaries, including superseded and rejected records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdrSummaryList'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create an ADR for a diagram
      parameters:
        - $ref: '#/components/parameters/DiagramId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrWrite'
      responses:
        '201':
          description: Created ADR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adr'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /adrs/{adrId}:
    get:
      summary: Get an ADR with its component links
      parameters:
        - $ref: '#/components/parameters/AdrId'
      responses:
        '200':
          description: ADR detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adr'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update ADR content or lifecycle metadata
      parameters:
        - $ref: '#/components/parameters/AdrId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrWrite'
      responses:
        '200':
          description: Updated ADR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adr'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DependencyConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Delete an ADR after dependency validation
      parameters:
        - $ref: '#/components/parameters/AdrId'
      responses:
        '204':
          description: ADR deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DependencyConflict'
  /adrs/{adrId}/components:
    put:
      summary: Replace all component links for an ADR
      parameters:
        - $ref: '#/components/parameters/AdrId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdrComponentsWrite'
      responses:
        '200':
          description: ADR with replaced links; an empty componentIds array is valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Adr'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /diagrams/{diagramId}/components/{componentId}:
    delete:
      summary: Delete a component only after ADR links are repaired
      parameters:
        - $ref: '#/components/parameters/DiagramId'
        - name: componentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Component deleted and updated diagram returned
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DependencyConflict'
components:
  parameters:
    DiagramId:
      name: diagramId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdrId:
      name: adrId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    NotFound:
      description: Requested diagram, ADR, replacement, or component was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Actionable validation failure; no mutation is committed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    DependencyConflict:
      description: Deletion or replacement is blocked by explicit references
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DependencyConflict'
  schemas:
    AdrWrite:
      type: object
      required: [title, context, decision, consequences, status]
      properties:
        title:
          type: string
          minLength: 1
        context:
          type: string
          minLength: 1
        decision:
          type: string
          minLength: 1
        consequences:
          type: string
          minLength: 1
        alternativesOrConstraints:
          type: string
          nullable: true
        status:
          type: string
          enum: [draft, accepted, superseded, rejected]
        replacementAdrId:
          type: string
          format: uuid
          nullable: true
    AdrComponentsWrite:
      type: object
      required: [componentIds]
      properties:
        componentIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    Adr:
      allOf:
        - $ref: '#/components/schemas/AdrWrite'
        - type: object
          required: [id, diagramId, componentIds, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            diagramId:
              type: string
              format: uuid
            componentIds:
              type: array
              uniqueItems: true
              items:
                type: string
                format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    AdrSummaryList:
      type: array
      items:
        type: object
        required: [id, title, status, updatedAt, componentCount]
        properties:
          id:
            type: string
            format: uuid
          title:
            type: string
          status:
            type: string
            enum: [draft, accepted, superseded, rejected]
          updatedAt:
            type: string
            format: date-time
          componentCount:
            type: integer
            minimum: 0
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    ValidationError:
      type: object
      required: [message, fields]
      properties:
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    DependencyConflict:
      type: object
      required: [message, blockers]
      properties:
        message:
          type: string
        blockers:
          type: array
          items:
            type: object
            required: [adrId, title, reason]
            properties:
              adrId:
                type: string
                format: uuid
              title:
                type: string
              reason:
                type: string
